services:
  Apie\McpServer\RunMcpServerCommand:
    arguments:
      - '@Apie\McpServer\Factory\RunnerFactoryInterface'
      - '@Apie\McpServer\Tool\ToolFactory'
      - '@Apie\McpServer\Tool\ToolRunner'
    tags:
      - { name: 'console.command' }
  Apie\McpServer\Factory\RunnerFactoryInterface:
    alias: Apie\McpServer\Factory\RunnerFactory
  Apie\McpServer\Factory\RunnerFactory:
    arguments:
      - '@Psr\Log\LoggerInterface'
  Apie\McpServer\Tool\ToolRunner:
    arguments:
      - '@Apie\Core\ContextBuilders\ContextBuilderFactory'
      - '@apie'
  Apie\McpServer\Tool\ToolFactory:
    arguments:
      - '@Apie\Core\ContextBuilders\ContextBuilderFactory'
      - '@Apie\SchemaGenerator\SchemaGenerator'
      - '@Apie\Core\BoundedContext\BoundedContextHashmap'
      - '@Apie\Common\ActionDefinitionProvider'